services:
  web:
    build: .
    container_name: elefun-pakkebygger
    ports:
      - "8787:8787"   # DSM reverse proxy forwards elefunpakkebygger.xxxx.no -> localhost:8787
    volumes:
      - wrangler-state:/app/.wrangler/state   # local D1 data survives rebuilds
    restart: unless-stopped

volumes:
  wrangler-state:
